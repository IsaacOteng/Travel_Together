<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Served from public/ so the path is the same in dev and in dist.
         src/assets is bundled and fingerprinted, so it has no stable URL here. -->
    <link rel="icon" type="image/png" href="/official_logo_nobg.png" />
    <link rel="apple-touch-icon" href="/official_logo_nobg.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link rel="preload" href="/fonts/clash-display-600.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/satoshi-400.woff2" as="font" type="font/woff2" crossorigin />

    <!-- Resolve the theme before first paint so a dark-mode visitor never
         sees a flash of the cream ground. Kept inline and dependency-free
         on purpose; the React ThemeProvider reads the same key. -->
    <script>
      (function () {
        try {
          var saved = localStorage.getItem("tt-theme");
          // Light is the brand default; dark is only ever an explicit choice.
          document.documentElement.dataset.theme =
            saved === "dark" ? "dark" : "light";
        } catch (e) {
          document.documentElement.dataset.theme = "light";
        }
      })();
    </script>
    <title>Travel Together | For Solo Travelers</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
